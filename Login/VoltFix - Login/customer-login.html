<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoltFix | เข้าสู่ระบบลูกค้า</title>

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700;800&amp;display=swap">

  <link rel="stylesheet" href="./css/customer-login.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <header class="brand">
        <div class="brand-icon-slot">
          <div class="logo-icon"><i data-lucide="zap" class="light"></i></div>
          <span class="brand-name">VoltFix</span>
        </div>
      </header>

      <h1 class="title">ยินดีต้อนรับ</h1>
      <p class="subtitle">เข้าสู่ระบบเพื่อใช้งาน VoltFix</p>

      <nav class="role-tabs" aria-label="ประเภทผู้ใช้งาน">
        <a class="role-tab active" href="./customer-login.html">ลูกค้า</a>
        <a class="role-tab " href="./technician-login.html">ช่างไฟ</a>
        <a class="role-tab " href="./admin-login.html">แอดมิน</a>
      </nav>

      <nav class="auth-tabs" aria-label="บัญชี">
        <a class="auth-tab active" href="customer-login.html">เข้าสู่ระบบ</a>
        <a class="auth-tab" href="customer-register.html">สมัครสมาชิก</a>
      </nav>

      <form action="../../Customer/index.html">

        <div class="form-group">
          <label class="form-label" for="customer-login-id">อีเมลหรือเบอร์โทร</label>
          <input class="input" id="customer-login-id" type="text" placeholder="เช่น piya@email.com หรือ 0812345678"
            autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="customer-login-password">รหัสผ่าน</label>
          <input class="input" id="customer-login-password" type="password" placeholder="กรอกรหัสผ่านของคุณ"
            autocomplete="current-password">
        </div>

        <div class="form-row">
          <label class="remember"><input type="checkbox"> จำฉันไว้</label>
          <a class="link" href="./customer-forgot-password.html">ลืมรหัสผ่าน?</a>
        </div>

        <button class="btn btn-blue" type="submit">เข้าสู่ระบบ</button>

      </form>
    </section>
  </main>
  <script>
    lucide.createIcons();
  </script>
</body>

</html>
