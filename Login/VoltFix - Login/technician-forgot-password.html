<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoltFix | ลืมรหัสผ่านช่างไฟ</title>

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700;800&amp;display=swap">

  <link rel="stylesheet" href="css/technician-forgot-password.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <header class="brand">
        <div class="brand-icon-slot">
          <div class="logo-icon"><i data-lucide="zap" class="light"></i></div>
          <span class="brand-name">VoltFix</span>
        </div>
      </header>

      <h1 class="title">ลืมรหัสผ่าน?</h1>
      <p class="subtitle">กรอกอีเมลเพื่อรับรหัส OTP สำหรับตั้งรหัสผ่านใหม่</p>

      <form action="./technician-login.html">

        <div class="form-group">
          <label class="form-label" for="technician-forgot-email">อีเมล</label>
          <input class="input" id="technician-forgot-email" type="email" placeholder="เช่น vichai@fix.co"
            autocomplete="email">
        </div>

        <button class="btn btn-blue" type="submit">ส่ง OTP ไปยังอีเมล</button>
      </form>

      <div class="otp-area">
        <p class="otp-hint">หลังจากได้รับ OTP สามารถนำรหัสไปยืนยันตัวตนและตั้งรหัสผ่านใหม่ได้</p>
        <a class="link" href="./technician-login.html">← กลับเข้าสู่ระบบ</a>
      </div>
    </section>
  </main>
  <script>
    lucide.createIcons();
  </script>
</body>

</html>
